name: 규칙 계산량 재기(임시)
on:
  push:
    branches: [probe-rules]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npx --yes firebase-tools@13.29.1 emulators:exec --only firestore --project demo-ssug-rules "node scripts/__probe-rules.mjs"
