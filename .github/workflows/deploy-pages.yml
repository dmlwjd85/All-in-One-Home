# 저장소 루트가 이 프로젝트일 때 깃허브 페이지에 배포합니다.
name: 깃허브 페이지에 배포

on:
  push:
    branches: [main, master]
  # 초안에서는 검사가 안 돌 수 있어, 리뷰 준비로 바꾼 뒤의 커밋과 준비 이벤트에서 돌립니다.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 기준 가지 가져오기
        run: git fetch --no-tags origin main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-13.29.1-${{ runner.os }}
      - name: 설치하고 빌드
        env:
          VITE_BASE: ./
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm install
          npm run check:links
          npm run check:hits
          npm run check:storage
          npm run check:quality
          npm run check:speech
          npm run check:keyfeel
          npm run check:kbtheme
          npm run check:brand
          npm run check:icons
          npm run check:gcal
          npm run check:period
          npm run check:five
          npm run check:sync
          npm run check:locknote
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless
          npm run check:rules
          npm run check:attendcloud
          npm run check:cloudpull
          npm run check:todosync
          npm run check:twodevice
          npm run build
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          CHROME_PATH=/usr/bin/google-chrome npm run check:attendsave
      - name: 브라우저에서 넘침과 버튼 크기 확인
        env:
          VITE_BASE: ./
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
        run: |
          npm run check:seal
          npm run check:quickbar
          npm run check:academic
          for day in 2026-10-23 2026-10-24 2026-10-25 2026-10-26 2026-10-31 2026-11-01 2026-12-25 2026-12-31 2027-01-01; do
            echo "브라우저 시계 ${day}"
            FIXED_NOW="${day}T08:42:00+09:00" npm run check:browser
          done
      - name: 빌드 결과 올리기
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 페이지에 배포
        id: deployment
        uses: actions/deploy-pages@v4
