# 저장소 루트가 이 프로젝트일 때 깃허브 페이지에 배포합니다.
# 검사는 네 묶음(빠른 검사 · 에뮬레이터 · 브라우저 · 날짜별 브라우저)으로 나눠 동시에 돌리고,
# 모두 통과해야 pages 잡이 다시 빌드해 올리고 배포합니다.
# 몇몇 검사(check:tabbar, check:goalsync, check:tabbarsync, check:jjaem-paste, check:gcal)가 이 파일의 글자를 읽습니다.
# - 에뮬레이터 목록에서 check:rules 를 check:goalsync·check:tabbarsync 보다 앞에 둡니다.
# - 브라우저 잡의 빌드 줄이 check:tabbar 줄보다 앞에 있어야 합니다.
# - 배포 잡 이름 앞쪽에는 actions 쓰기 권한을 두지 않습니다.
# 그래서 이 주석에는 실행 줄 글자를 그대로 적지 않습니다.
name: 깃허브 페이지에 배포

on:
  push:
    branches: [main, master]
  # 초안에서는 검사가 안 돌 수 있어, 리뷰 준비로 바꾼 뒤의 커밋과 준비 이벤트에서 돌립니다.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) 설치만 있으면 되는 빠른 검사
  quick:
    name: 빠른 검사
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      VITE_BASE: ./
      VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 기준 가지 가져오기
        run: git fetch --no-tags origin main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 설치
        run: npm install
      - name: 검사
        run: |
          npm run check:links
          npm run check:hits
          npm run check:storage
          npm run check:quality
          npm run check:speech
          npm run check:keyfeel
          npm run check:kbtheme
          npm run check:brand
          npm run check:icons
          npm run check:gcal
          npm run check:period
          npm run check:five
          npm run check:sync
          npm run check:sync-cost
          npm run check:locknote
          npm run check:hlc
          npm run check:alarm
          npm run check:datechip
          npm run check:nice-datechip
          npm run check:jjaem-paste
          npm run check:todoachieve
          npm run check:input-e
          npm run check:widgets
          npm run check:sensitive
          npm run check:keep-text
          npm run check:name-link
          npm run check:roster
          npm run check:class-xlsx

  # 2) Firestore 에뮬레이터 검사. 서로 다른 러너에서 하나씩 돌려 기다리는 시간을 겹칩니다.
  emulator:
    name: 에뮬레이터 (${{ matrix.run }})
    timeout-minutes: 40
    runs-on: ubuntu-latest
    env:
      VITE_BASE: ./
      VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        run:
          - npm run check:rules
          - npm run check:attendcloud
          - npm run check:cloudpull
          - npm run check:todosync
          - npm run check:twodevice
          - npm run check:leavesync
          - npm run check:lwwsync
          - npm run check:lwwprev
          - npm run check:lwwmix
          - npm run check:keptpaths
          - npm run check:tabbarsync
          - npm run check:goalsync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 기준 가지 가져오기
        run: git fetch --no-tags origin main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-13.29.1-${{ runner.os }}
      - name: 설치
        run: npm install
      - name: 검사
        run: ${{ matrix.run }}

  # 3) 빌드한 화면을 크롬으로 보는 검사
  browser:
    name: 브라우저 (${{ matrix.part }})
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 기준 가지 가져오기
        run: git fetch --no-tags origin main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 설치하고 빌드
        env:
          VITE_BASE: ./
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm install
          npm run build
      - name: 크롬 설치
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
      - name: 검사
        env:
          VITE_BASE: ./
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
        run: ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 화면
            run: |
              CHROME_PATH=/usr/bin/google-chrome npm run check:ioslogin
              CHROME_PATH=/usr/bin/google-chrome npm run check:attendsave
              CHROME_PATH=/usr/bin/google-chrome npm run check:swreload
              CHROME_PATH=/usr/bin/google-chrome npm run check:tabbar
              CHROME_PATH=/usr/bin/google-chrome npm run check:ui-a
              CHROME_PATH=/usr/bin/google-chrome npm run check:side-hotkey
          - part: 할 일·입력
            run: |
              CHROME_PATH=/usr/bin/google-chrome npm run check:todoshots
              CHROME_PATH=/usr/bin/google-chrome npm run check:input-e-browser
              CHROME_PATH=/usr/bin/google-chrome npm run check:g1
              CHROME_PATH=/usr/bin/google-chrome npm run check:nice-datechip-browser
              CHROME_PATH=/usr/bin/google-chrome npm run check:minutes-edit-top
              CHROME_PATH=/usr/bin/google-chrome npm run check:neis-xlsx
          - part: 넘침과 버튼 크기
            run: |
              npm run check:seal
              npm run check:quickbar
              npm run check:academic
              CHROME_PATH=/usr/bin/google-chrome npm run check:widgets-browser
          - part: 시계 10월
            run: |
              for day in 2026-10-23 2026-10-24 2026-10-25; do
                echo "브라우저 시계 ${day}"
                FIXED_NOW="${day}T08:42:00+09:00" npm run check:browser
              done
          - part: 시계 10~11월
            run: |
              for day in 2026-10-26 2026-10-31 2026-11-01; do
                echo "브라우저 시계 ${day}"
                FIXED_NOW="${day}T08:42:00+09:00" npm run check:browser
              done
          - part: 시계 연말
            run: |
              for day in 2026-12-25 2026-12-31 2027-01-01; do
                echo "브라우저 시계 ${day}"
                FIXED_NOW="${day}T08:42:00+09:00" npm run check:browser
              done

  # 4) 검사가 모두 통과하면 배포용으로 다시 빌드해 올립니다.
  pages:
    name: 배포용 빌드
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    needs: [quick, emulator, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 설치하고 빌드
        env:
          VITE_BASE: ./
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm install
          npm run build
      - name: 빌드 결과 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 페이지에 배포
        id: deployment
        uses: actions/deploy-pages@v4
