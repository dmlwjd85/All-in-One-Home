<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#E8E4DE">
    <meta name="description" content="쨈 교무수첩. 초등 담임이 오늘 필요한 출결·기록·할 일을 한 화면에서 남깁니다.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="쨈 교무수첩">
    <title>쨈 교무수첩</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon.svg?v=19" type="image/svg+xml">
    <link rel="icon" href="./favicon.ico?v=19" sizes="16x16 32x32">
    <link rel="icon" href="./favicon-32.png?v=19" sizes="32x32" type="image/png">
    <link rel="icon" href="./favicon-16.png?v=19" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=19" sizes="180x180">
    <link rel="preload" href="./fonts/JJAEMBody-Regular.first.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/JJAEMBody-Bold.first.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/JJAEM-TitleFlat-Regular.first.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./fonts/fonts.css">
    <script>
        try {
            var hash = location.hash || '';
            if (hash.indexOf('access_token=') !== -1 || hash.indexOf('error=access_denied') !== -1) {
                sessionStorage.setItem('ssug-gyomu-gcal-hash', hash);
                history.replaceState(null, '', location.pathname + location.search + '#/settings');
            }
            var q = new URLSearchParams(location.search);
            if (q.get('mode') === 'dark' || q.get('mode') === 'light') localStorage.setItem('ssug-gyomu-theme', q.get('mode'));
            var saved = localStorage.getItem('ssug-gyomu-theme');
            var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
            var font = localStorage.getItem('ssug-gyomu-font');
            if (font === 'soft' || font === 'neat') document.documentElement.setAttribute('data-font', font);
            // 전체 글꼴은 fonts.css 의 @font-face 를 document.fonts.load 로 받습니다. 화면이 쓰는 것과 같은 face라 어느 엔진에서도 한 번만 받습니다.
            // '힣'은 첫 화면 파일(.first) 범위 밖이라 전체 파일만 받습니다. 이 스크립트는 fonts.css 를 다 읽은 뒤에 돕니다.
            var warmFonts = function () {
                try {
                    ['400 1em "JJAEM Body"', '700 1em "JJAEM Body"', '400 1em "JJAEM Title Flat"'].forEach(function (face) {
                        document.fonts.load(face, '\uD7A3').catch(function () {});
                    });
                } catch (e) {}
            };
            // 쓰던 기기나 예시 학급은 바로 오늘 화면이 열려서, 전체 글꼴을 곧바로 받아 글자가 바뀌며 화면이 밀리지 않게 합니다.
            // 처음 오는 분의 로그인 화면은 작은 글꼴 파일만 먼저 받고, 화면을 다 그린 뒤 쉬는 틈에 다음 화면 글꼴을 받아 둡니다.
            if (localStorage.getItem('ssug-gyomu-tips') || q.get('demo') === '1') {
                warmFonts();
            } else {
                addEventListener('load', function () {
                    (window.requestIdleCallback || function (run) { setTimeout(run, 200); })(warmFonts, { timeout: 4000 });
                }, { once: true });
            }
            if (dark) document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta && dark) meta.setAttribute('content', '#2A2627');
        } catch (e) {}
    </script>
</head>
<body>
    <div id="root">
        <p style="padding:2rem;font-size:1.125rem;font-weight:700;">쨈 교무수첩을 열고 있어요.</p>
    </div>
    <noscript>
        <p style="padding:2rem;">쨈 교무수첩을 쓰려면 브라우저에서 자바스크립트를 켜 주세요.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
