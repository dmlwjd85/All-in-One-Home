<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#E8E4DE">
    <meta name="description" content="콕 교무수첩. 열자마자 콕, 적. 초등 담임이 오늘 필요한 출결·기록·할 일을 한 화면에서 남깁니다.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="콕 교무수첩">
    <title>콕 교무수첩</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
    <link rel="preload" href="./fonts/Pretendard-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/Pretendard-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/NanumSquareRoundB.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./fonts/fonts.css">
    <script>
        try {
            var hash = location.hash || '';
            if (hash.indexOf('access_token=') !== -1 || hash.indexOf('error=access_denied') !== -1) {
                sessionStorage.setItem('ssug-gyomu-gcal-hash', hash);
                history.replaceState(null, '', location.pathname + location.search + '#/settings');
            }
            var q = new URLSearchParams(location.search);
            if (q.get('mode') === 'dark' || q.get('mode') === 'light') localStorage.setItem('ssug-gyomu-theme', q.get('mode'));
            var saved = localStorage.getItem('ssug-gyomu-theme');
            var dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
            var font = localStorage.getItem('ssug-gyomu-font');
            if (font === 'soft' || font === 'neat') document.documentElement.setAttribute('data-font', font);
            if (dark) document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta && dark) meta.setAttribute('content', '#2A2627');
        } catch (e) {}
    </script>
</head>
<body>
    <div id="root">
        <p style="padding:2rem;font-size:1.125rem;font-weight:700;">콕 교무수첩을 열고 있어요.</p>
    </div>
    <noscript>
        <p style="padding:2rem;">콕 교무수첩을 쓰려면 브라우저에서 자바스크립트를 켜 주세요.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
